# Checks every push and pull request: format, lint, unit tests on Linux and Windows,
# and the scripted end-to-end UI suites on a virtual display.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/release-version.mjs --check

  ui:
    name: UI suites (Xvfb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libgl1-mesa-dev \
            xvfb mesa-utils libgl1-mesa-dri
      - run: cargo build --locked -p findex-app
      # The transfer suite copies a 2 GB sparse file; the others run in seconds.
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" tests/ui/run.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: target/ui-test*
          retention-days: 7
