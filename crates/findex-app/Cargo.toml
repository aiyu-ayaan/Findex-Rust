[package]
name = "findex-app"
description = "Findex main binary: window, tabs, navigation, search, transfers."
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "findex"
path = "src/main.rs"

[features]
# Release build of the dev flavour (separate config, socket and port; see findex_core::flavor).
dev = ["findex-core/dev"]

[dependencies]
findex-core.workspace = true
findex-platform.workspace = true
findex-ops.workspace = true
findex-scan.workspace = true
findex-thumbs.workspace = true
findex-ui.workspace = true
findex-link.workspace = true
qrcode = { version = "0.14", default-features = false }

slint = { workspace = true, features = ["std", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle.workspace = true
dirs.workspace = true
trash.workspace = true
image.workspace = true
serde_json.workspace = true
